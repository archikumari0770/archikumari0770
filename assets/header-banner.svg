<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141321"/>
      <stop offset="45%" stop-color="#5B2A6E"/>
      <stop offset="75%" stop-color="#FE428E"/>
      <stop offset="100%" stop-color="#A9FEF7"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FE428E" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FE428E" stop-opacity="0"/>
    </radialGradient>
    <filter id="softBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <style>
      .dot { animation: floatY 6s ease-in-out infinite; }
      .dot2 { animation: floatY 7.5s ease-in-out infinite; animation-delay: -2s; }
      .dot3 { animation: floatY 5s ease-in-out infinite; animation-delay: -4s; }
      @keyframes floatY {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-14px); }
      }
      /* Default state is fully visible so text never disappears if a
         viewer's renderer ignores the animation; the animation itself
         starts from a hidden state purely as progressive enhancement. */
      .title { animation: fadeUp 1.1s ease-out forwards; }
      .subtitle { animation: fadeUp 1.1s ease-out 0.35s forwards; }
      .rule { animation: growLine 1.2s ease-out 0.7s forwards; }
      @keyframes fadeUp {
        from { opacity: 0; transform: translateY(14px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      @keyframes growLine {
        from { stroke-dashoffset: 220; }
        to   { stroke-dashoffset: 0; }
      }
      .twinkle { animation: twinkle 3s ease-in-out infinite; }
      .twinkle2 { animation: twinkle 4s ease-in-out infinite; animation-delay: -1.5s; }
      @keyframes twinkle {
        0%, 100% { opacity: 0.25; }
        50% { opacity: 0.9; }
      }
    </style>
  </defs>

  <!-- base -->
  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#glow)"/>

  <!-- soft blurred orbs for depth -->
  <circle cx="1030" cy="70" r="95" fill="#A9FEF7" opacity="0.18" filter="url(#softBlur)"/>
  <circle cx="150" cy="250" r="110" fill="#FE428E" opacity="0.16" filter="url(#softBlur)"/>

  <!-- floating accent dots -->
  <circle class="dot twinkle" cx="120" cy="70" r="4" fill="#A9FEF7"/>
  <circle class="dot2 twinkle2" cx="1080" cy="200" r="3.5" fill="#FE428E"/>
  <circle class="dot3 twinkle" cx="220" cy="150" r="3" fill="#FFFFFF"/>
  <circle class="dot twinkle2" cx="960" cy="110" r="3" fill="#A9FEF7"/>
  <circle class="dot2 twinkle" cx="80" cy="230" r="2.5" fill="#FE428E"/>
  <circle class="dot3 twinkle2" cx="1120" cy="260" r="4" fill="#FFFFFF"/>

  <!-- angle-bracket code accents -->
  <text x="70" y="185" font-family="'Fira Code','Courier New',monospace" font-size="34" fill="#A9FEF7" opacity="0.35" class="dot">&lt;/&gt;</text>
  <text x="1010" y="270" font-family="'Fira Code','Courier New',monospace" font-size="28" fill="#FE428E" opacity="0.3" class="dot2">{ }</text>

  <!-- title -->
  <text class="title" x="600" y="150" text-anchor="middle"
        font-family="'Segoe UI','Trebuchet MS',sans-serif" font-size="58" font-weight="700" fill="#ffffff">
    Archi Kumari
  </text>

  <!-- decorative rule -->
  <line class="rule" x1="490" y1="178" x2="710" y2="178" stroke="#FE428E" stroke-width="3"
        stroke-linecap="round" stroke-dasharray="220" stroke-dashoffset="0"/>

  <!-- subtitle -->
  <text class="subtitle" x="600" y="215" text-anchor="middle"
        font-family="'Segoe UI','Trebuchet MS',sans-serif" font-size="21" font-weight="500" fill="#EDEBFF">
    AI Agent Developer  •  Full-Stack Builder  •  Compiler Enthusiast
  </text>

  <!-- bottom wave -->
  <path d="M0,320 L0,290 Q150,250 300,290 T600,290 T900,290 T1200,290 L1200,320 Z" fill="#0B0A14" opacity="0.55"/>
</svg>
