<svg width="1200" height="140" viewBox="0 0 1200 140" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgFooter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A9FEF7"/>
      <stop offset="50%" stop-color="#FE428E"/>
      <stop offset="100%" stop-color="#141321"/>
    </linearGradient>
    <style>
      .spark { animation: floatY 5s ease-in-out infinite; }
      @keyframes floatY {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
    </style>
  </defs>
  <rect width="1200" height="140" fill="url(#bgFooter)"/>
  <path d="M0,0 L0,30 Q150,60 300,30 T600,30 T900,30 T1200,30 L1200,0 Z" fill="#0B0A14" opacity="0.4"/>
  <circle class="spark" cx="130" cy="90" r="3" fill="#ffffff" opacity="0.7"/>
  <circle class="spark" cx="1060" cy="70" r="3.5" fill="#141321" opacity="0.5"/>
  <text x="600" y="95" text-anchor="middle" font-family="'Segoe UI','Trebuchet MS',sans-serif"
        font-size="18" font-weight="600" fill="#141321">
    Thanks for stopping by ✨
  </text>
</svg>
